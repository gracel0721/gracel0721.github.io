<footer>
  <div class="footer-content">
    <p>This is a static website built with HTML, CSS, and Jekyll.</p>

    <div class="footer-socials">
      <p>Connect with me!</p>
      <div class="footer-icons">
        <a href="{{ site.data.socials.linkedin.href }}{{ site.data.socials.linkedin.id }}" title="LinkedIn"><i class="{{site.data.socials.linkedin.fa-icon}}"></i></a>
        <a href="{{ site.data.socials.github.href }}{{ site.data.socials.github.id }}" title="GitHub"><i class="{{site.data.socials.github.fa-icon}}"></i></a>
        <a href="{{ site.data.socials.instagram.href }}{{ site.data.socials.instagram.id }}" title="Instagram"><i class="{{site.data.socials.instagram.fa-icon}}"></i></a>
      </div>
    </div>

    <div class="footer-copyright">
      <a href="https://creativecommons.org/licenses/by-nc/3.0/deed.en_US">
        <b>{{ site.owner }}</b>
        {% capture currentyear %}{{ 'now' | date: "%Y" }}{% endcapture %}
        <span>© {{ currentyear }}</span>
      </a>
    </div>
  </div>
</footer>

<style>
.footer-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.footer-socials {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.footer-icons {
  display: flex;
  gap: 20px;
  font-size: 20px;
}
.footer-copyright {
  font-size: 14px;
  opacity: 0.8;
}
.footer-copyright a {
  color: inherit;
  text-decoration: none;
}
</style>
