<header>
  <div class="header-content">
    <div class="terminal-window">
      <div class="terminal-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <a href="{{ "/" | prepend: site.baseurl | replace: '//', '/' }}">
        {% assign owner_first_name = site.owner | split: " " %}
        <h1 class="terminal-title">{{ owner_first_name[0] | downcase }}@home:~$</h1>
      </a>
    </div>
    <div class="header-links">
      {% include links.html %}
    </div>
  </div>
</header>

<style>
.header-content {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.terminal-window {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  padding: 10px 20px;
  border: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 10px;
}
.terminal-dots {
  display: flex;
  gap: 6px;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.red { background: #ff5f56; }
.yellow { background: #ffbd2e; }
.green { background: #27c93f; }
.terminal-title {
  margin: 0 !important;
  font-size: 20px !important;
  text-shadow: 0 0 10px rgba(181, 232, 83, 0.5) !important;
}
</style>
